name: Update NIFTY OHLC

on:
  workflow_dispatch:
  schedule:
    # 6:45 PM India time = 13:15 UTC.
    # Monday-Friday.
    - cron: "15 13 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update NIFTY OHLC
        run: python scripts/update_nifty_ohlc.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nifty_ohlc.csv data/nifty_ohlc.json
          git diff --cached --quiet || git commit -m "Auto-update NIFTY OHLC"
          git push
