name: Update NIFTY OHLC

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is interpreted in UTC; these are the IST-equivalent instants.
    # 06:00 IST daily = 00:30 UTC
    - cron: "30 0 * * *"
    # 21:00 IST daily = 15:30 UTC
    - cron: "30 15 * * *"

permissions:
  contents: write

concurrency:
  group: nifty-ohlc-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Show IST run time
        run: date "+Workflow started at %Y-%m-%d %H:%M:%S %Z (IST)"

      - name: Update NIFTY OHLC
        run: python scripts/update_nifty_ohlc.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nifty_ohlc.csv data/nifty_ohlc.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update NIFTY OHLC"
            git push
          fi
