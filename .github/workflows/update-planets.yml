name: Update Planet Transit Data

on:
  workflow_dispatch:

  schedule:
    # December 15 every year
    # 07:00 IST = 01:30 UTC
    - cron: "30 1 15 12 *"

permissions:
  contents: write

jobs:
  update-planets:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python packages
        run: |
          pip install selenium
          pip install beautifulsoup4
          pip install openpyxl
          pip install python-dateutil

      - name: Update next year planet data
        run: |
          python scripts/update_planet_transits.py

      - name: Commit updated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "data/Planets Transists.xlsx"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update planet transit data"
            git push
          fi
