<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080C14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<title>ASTRO NIFTY Mobile</title>
<style>
:root{color-scheme:dark;--bg:#080C14;--card:#111827;--line:#22304A;--txt:#E8EDF5;--dim:#94A3B8;--acc:#3B82F6;--up:#22C55E;--dn:#EF4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(8,12,20,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}
h1{font-size:17px;margin:0}h1 i{font-style:normal;color:#60A5FA}small{color:var(--dim)}
nav{display:flex;gap:8px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:9px 12px}
button.active{background:#1d4ed8;border-color:#2563eb}
main{padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.mono{font-family:ui-monospace,monospace}.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}
iframe{width:100%;height:calc(100vh - 112px);border:0;border-radius:12px;background:var(--bg)}
input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0c111c;color:var(--txt);margin:8px 0}
a{color:#60A5FA}
.status{font-size:12px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<header><h1>ASTRO <i>NIFTY</i> Mobile</h1><div class="status" id="status">Starting…</div></header>
<nav>
<button id="dash" class="active">Dashboard</button>
<button id="alerts">Alerts</button>
<button id="install" hidden>Install</button>
</nav>
<main id="app"></main>
<script>
const DASHBOARD_URL="https://chris124839.github.io/astro-nifty-dashboard/";
const NTFY_DEFAULT="astro-nifty-e4e5ef2cddc6d6040f0840eb";
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.querySelector("#install").hidden=false;});
document.querySelector("#install").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;};
function showDashboard(){app.innerHTML=`<iframe title="ASTRO NIFTY dashboard" src="${DASHBOARD_URL}" loading="eager"></iframe>`;document.querySelector("#dash").classList.add("active");document.querySelector("#alerts").classList.remove("active");}
function showAlerts(){
 const topic=localStorage.getItem("ntfyTopic")||NTFY_DEFAULT;
 app.innerHTML=`<div class="card"><h2>Mobile Alerts</h2>
 <div class="dim">Notifications are delivered through ntfy. Install the free ntfy mobile app, subscribe to the same topic, and GitHub Actions will publish alerts.</div>
 <input id="topic" value="${topic}" placeholder="Your ntfy topic">
 <button id="save">Save topic</button>
 <div class="status">GitHub Secret required: <b>NTFY_TOPIC</b>. The dashboard itself is unchanged.</div>
 </div>
 <div class="card"><h2>Alert types</h2>
 <div class="row"><span>Morning astro/NIFTY alert</span><span>✓</span></div>
 <div class="row"><span>Upcoming planetary aspect</span><span>✓</span></div>
 <div class="row"><span>Historical probability</span><span>✓</span></div>
 <div class="row"><span>NSE holiday/session check</span><span>Later</span></div>
 </div>`;
 document.querySelector("#save").onclick=()=>{localStorage.setItem("ntfyTopic",document.querySelector("#topic").value.trim());document.querySelector(".status").textContent="Saved on this device.";}
 document.querySelector("#dash").classList.remove("active");document.querySelector("#alerts").classList.add("active");
}
dash.onclick=showDashboard;alerts.onclick=showAlerts;
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").then(()=>status.textContent="Ready to install");
else status.textContent="Open in a supported mobile browser";
showDashboard();
</script>
</body>
</html>
